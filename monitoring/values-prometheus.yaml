grafana:
  adminPassword: admin   # local learning only, change for any real environment
  defaultDashboardsTimezone: Asia/Karachi

prometheus:
  prometheusSpec:
    retention: 15d
    # pick up ServiceMonitors and PodMonitors from all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
