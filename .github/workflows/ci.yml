name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax check
        run: python -m py_compile analysis/rightsize.py analysis/apply.py analysis/compare.py apps/demo-app/app.py

      - name: Build demo image
        run: docker build -t costpilot-demo:ci apps/demo-app

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: costpilot-demo:ci
          severity: CRITICAL,HIGH
          exit-code: "0"   # report only for now; set to "1" to fail the build on findings
